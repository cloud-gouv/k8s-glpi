{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: glpi-listeners
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-envoy-prod
spec:
  parentRef:
    name: platform-gateway
    namespace: envoy-gateway-system
    kind: Gateway
    group: gateway.networking.k8s.io
  listeners:
    - name: https-glpi
      hostname: {{ .Values.gateway.host }}
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - group: ''
            kind: Secret
            name: {{ .Values.gateway.host }}
      allowedRoutes:
        namespaces:
          from: Same
    # HTTP:80 pour le challenge HTTP-01 de cert-manager
    - name: http-glpi
      hostname: {{ .Values.gateway.host }}
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: glpi-https
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    external-dns.kubernetes.io/gateway-hostname-source: defined-hosts-only
    external-dns.alpha.kubernetes.io/ttl: '10'
spec:
  parentRefs:
    - name: glpi-listeners
      kind: ListenerSet
      group: gateway.networking.k8s.io
      sectionName: https-glpi
  hostnames:
    - {{ .Values.gateway.host }}
  rules:
    - name: glpi-all-paths
      matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: nginx
          port: 80
{{- end }}
