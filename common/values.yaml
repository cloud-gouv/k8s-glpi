glpi:
  language: "fr_FR"
  phpfpm:
    # Number of PHP-FPM replicas.
    # Ignored (Kubernetes/HPA owns the field instead) when autoscaling.enabled is true.
    # Remember the shared-storage caveat: php-fpm reads/writes GLPI_VAR_DIR (uploads,
    # sessions) on a PVC. Scaling beyond 1 replica requires that PVC to use a
    # ReadWriteMany-capable storageClass (NFS, CephFS, EFS, etc) - see
    # glpi.persistence.files.accessMode.
    replicaCount: 1
    autoscaling:
      enabled: false
  nginx:
    replicaCount: 2
    pdb:
      enabled: true
      minAvailable: ""
      maxUnavailable: 1
    configTemplate: |-
      server {
          listen 8080;

          server_name glpi.localhost;

          root /var/www/html/public;

          location / {
              try_files $uri /index.php$is_args$args;
          }

          location ~ ^/index\.php$ {
              fastcgi_pass php-fpm.{{ include "glpi.namespace" . }}.svc.cluster.local:9000;

              fastcgi_split_path_info ^(.+\.php)(/.*)$;
              include fastcgi_params;

              fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
          }
      }
  securityContext:
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
valkey:
  standalone:
    resources:
      limits:
        memory: 256Mi
      requests:
        memory: 256Mi
