glpi:
  language: "fr_FR"

  phpfpm:
    # Number of PHP-FPM replicas.
    # Ignored (Kubernetes/HPA owns the field instead) when autoscaling.enabled is true.
    # Remember the shared-storage caveat: php-fpm reads/writes GLPI_VAR_DIR (uploads,
    # sessions) on a PVC. Scaling beyond 1 replica requires that PVC to use a
    # ReadWriteMany-capable storageClass (NFS, CephFS, EFS, etc) - see
    # glpi.persistence.files.accessMode.
    replicaCount: 1
    autoscaling:
      enabled: false

  nginx:
    replicaCount: 2

    pdb:
      enabled: true
      minAvailable: ""
      maxUnavailable: 1

    configTemplate: |-
      server {
          listen 8080;

          server_name glpi.localhost;

          root /var/www/html/public;

          location / {
              try_files $uri /index.php$is_args$args;
          }

          location ~ ^/index\.php$ {
              fastcgi_pass php-fpm.{{ include "glpi.namespace" . }}.svc.cluster.local:9000;

              fastcgi_split_path_info ^(.+\.php)(/.*)$;
              include fastcgi_params;

              fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
          }
      }

  securityContext:
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    external-dns.alpha.kubernetes.io/ingress-hostname-source: defined-hosts-only
    external-dns.alpha.kubernetes.io/ttl: "10"
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: glpi.opicloud-ohe-dev-osc-euw2-wapp-02.k8s.dev.opicloud.fr
      paths:
        - path: /
          pathType: Prefix
  tls:
  - hosts:
    - glpi.opicloud-ohe-dev-osc-euw2-wapp-02.k8s.dev.opicloud.fr
    secretName: glpi
